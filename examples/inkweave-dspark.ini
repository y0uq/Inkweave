version = 1

[Inkling-2-Mini]
; Run from the repository root or use absolute paths.
model = models/Inkling/Inkling-2-Mini-UD-Q3_K_XL.gguf
mmproj = models/Inkling/mmproj-F16.gguf
load-on-startup = true

ctx-size = 262144
parallel = 1
cache-type-k = q8_0
cache-type-v = q8_0
swa-full = false
flash-attn = on

device = Vulkan0
n-gpu-layers = all
fit = off
load-mode = none
; Keep dense weights on Vulkan and the full expert pool in pinned RAM.
n-cpu-moe = 0
override-tensor = ^token_embd[.]weight$=Vulkan0,^blk[.][0-9]+[.]ffn_(up|down|gate|gate_up)_(ch|)exps=CPU
moe-cache-mib = 5750
moe-cache-cpu-share = 0.4

threads = 8
threads-batch = 8
batch-size = 1024
ubatch-size = 1024
cache-prompt = true
cache-ram = 0
no-cache-idle-slots = true

model-draft = models/Inkling/dspark-Inkling-2-Mini-Q8_0.gguf
spec-type = draft-dspark
spec-draft-device = Vulkan0
spec-draft-ngl = all
spec-draft-n-max = 4
spec-draft-n-ubatch = 128
spec-draft-sampling = greedy
cache-type-k-draft = q8_0
cache-type-v-draft = q8_0

jinja = true
temperature = 0.0
top-p = 1.0
top-k = 0
min-p = 0.0
repeat-penalty = 1.0
